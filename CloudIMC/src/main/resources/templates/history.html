<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>IMC Calculator - History</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 28px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 15px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        tr {
            border-bottom: 1px solid #dddddd;
        }
        tr:nth-of-type(even) {
            background-color: #f8f9fa;
        }
        tr:last-of-type {
            border-bottom: 2px solid #2c3e50;
        }
        .no-records {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 20px;
        }
        button {
            display: block;
            width: 200px;
            margin: 20px auto 0 auto;
            padding: 12px;
            background-color: #95a5a6;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calculation History</h1>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Weight (kg)</th>
                    <th>Height (cm)</th>
                    <th>IMC Value</th>
                    <th>IMC Category</th>
                    <th>Date Added</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="record : ${records}">
                    <td th:text="${record.name}">John</td>
                    <td th:text="${record.weight}">70.0</td>
                    <td th:text="${record.height}">175</td>
                    <td th:text="${record.imcValue}">22.86</td>
                    <td th:text="${record.category}">Normal</td>
                    <td th:text="${#temporals.format(record.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-31 12:00</td>
                </tr>
                <tr th:if="${#lists.isEmpty(records)}">
                    <td colspan="6" class="no-records">No records found in database.</td>
                </tr>
            </tbody>
        </table>

        <a href="/" style="text-decoration: none;">
            <button type="button">Back to Home</button>
        </a>
    </div>
</body>
</html>
