<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>IMC Calculator - Result</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h1, h3 {
            color: #2c3e50;
            text-align: center;
            margin-top: 0;
        }
        h1 { font-size: 28px; }
        h3 { font-size: 20px; margin-top: 10px; }
        
        .result-box {
            background-color: #e8f4fd;
            border-left: 5px solid #3498db;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 25px;
            text-align: center;
        }
        .result-box h2 { margin: 0 0 10px 0; color: #2c3e50; }
        .result-box h3 { margin: 0 0 10px 0; color: #2980b9; font-size: 24px; }
        .result-box p { margin: 0; font-size: 16px; }

        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #2980b9; }
        .btn-secondary { background-color: #95a5a6; margin-top: 15px; }
        .btn-secondary:hover { background-color: #7f8c8d; }
        hr { border: 0; height: 1px; background: #e0e0e0; margin: 25px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calculation Result</h1>

        <div class="result-box">
            <h2>Hello <span th:text="${currentName}">User</span>!</h2>
            <h3>Your IMC is: <span th:text="${currentImc}">0.00</span></h3>
            <p>Category: <strong><span th:text="${currentCategory}">To be determined</span></strong></p>
        </div>

        <hr>

        <h3>Want to recalculate?</h3>
        <form action="/calculate" method="POST">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" th:value="${currentName}" required>
            </div>
            <div class="form-group">
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" name="weight" step="0.5" th:value="${currentWeight}" required>
            </div>
            <div class="form-group">
                <label for="height">Height (cm):</label>
                <input type="number" id="height" name="height" step="1" th:value="${currentHeight}" required>
            </div>
            <button type="submit">Recalculate</button>
        </form>

        <hr>

        <a href="/history" style="text-decoration: none;">
            <button type="button" class="btn-secondary">View History</button>
        </a>
    </div>
</body>
</html>
