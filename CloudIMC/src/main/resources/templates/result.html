<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>IMC Calculator - Result</title>
</head>
<body>
    <h1>Calculation Result</h1>

    <div style="background-color: #f0f0f0; padding: 15px; margin-bottom: 20px;">
        <h2>Hello <span th:text="${currentName}">User</span>!</h2>
        <h3>Your IMC is: <span th:text="${currentImc}">0.00</span></h3>
        <p>Category: <strong><span th:text="${currentCategory}">To be determined</span></strong></p>
    </div>

    <hr>

    <h3>Want to recalculate?</h3>
    <form action="/calculate" method="POST">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" th:value="${currentName}" required>
        </div>
        <br>
        <div>
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" name="weight" step="0.5" th:value="${currentWeight}" required>
        </div>
        <br>
        <div>
            <label for="height">Height (cm):</label>
            <input type="number" id="height" name="height" step="1" th:value="${currentHeight}" required>
        </div>
        <br>
        <button type="submit">Recalculate</button>
    </form>

    <hr>

    <a href="/history">
        <button type="button">View History</button>
    </a>
</body>
</html>
