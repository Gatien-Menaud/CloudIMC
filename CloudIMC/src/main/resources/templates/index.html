<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>IMC Calculator - Home</title>
</head>
<body>
    <h1>IMC Calculator</h1>
    
    <form action="/calculate" method="POST">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required placeholder="Enter your name">
        </div>
        <br>
        <div>
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" name="weight" step="0.5" required placeholder="e.g. 70">
        </div>
        <br>
        <div>
            <label for="height">Height (cm):</label>
            <input type="number" id="height" name="height" step="1" required placeholder="e.g. 175">
        </div>
        <br>
        <button type="submit">Calculate IMC</button>
    </form>

    <hr>

    <a href="/history">
        <button type="button">View History</button>
    </a>
</body>
</html>
