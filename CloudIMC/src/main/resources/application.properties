spring.application.name=CloudIMC

# 1. Configuration de la connexion MySQL (Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/imc_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configuration JPA / Hibernate
# Dit à Java de créer automatiquement les tables SQL dans MySQL d'après notre code
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect