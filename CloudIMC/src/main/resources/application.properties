# ===================================================================
# CONFIGURATION DE LA BASE DE DONNÉES (POSTGRESQL POUR RENDER)
# ===================================================================
# Si DATABASE_URL existe (sur Render), Spring l'utilise.
# Sinon, il se connecte à un PostgreSQL local sur le port 5432.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/imc_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURATION DE HIBERNATE / JPA
# ===================================================================
# 'update' permet à Hibernate de créer les tables automatiquement au démarrage 
# sans jamais effacer les données existantes dans la base.
spring.jpa.hibernate.ddl-auto=update

# Permet de voir les requêtes SQL générées par Spring dans ton terminal (très utile pour le debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Définit le dialecte SQL spécifique à PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# CONFIGURATION DU SERVEUR
# ===================================================================
# Port standard sur lequel Spring Boot va écouter (Render détectera automatiquement ce port)
server.port=8080

# ===================================================================
# CONFIGURATION DE THYMELEAF (OPTIONNEL POUR LE DÉVELOPPEMENT)
# ===================================================================
# Désactive le cache Thymeleaf pour que les modifications HTML soient visibles immédiatement en local
spring.thymeleaf.cache=false