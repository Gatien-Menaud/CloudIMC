# ===================================================================
# CONFIGURATION DE LA BASE DE DONNÉES (POSTGRESQL POUR RENDER)
# ===================================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/imc_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURATION DE HIBERNATE / JPA
# ===================================================================
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# CONFIGURATION DU SERVEUR
# ===================================================================
server.port=8080

# ===================================================================
# CONFIGURATION DE THYMELEAF (OPTIONNEL POUR LE DÉVELOPPEMENT)
# ===================================================================
spring.thymeleaf.cache=false