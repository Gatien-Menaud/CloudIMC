services:
  # 1. Configuration de l'application Java Spring Boot via Docker
  - type: web
    name: cloud-imc-app
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: imc-db-postgres
          property: connectionString

# 2. Configuration de la base de données PostgreSQL
databases:
  - name: imc-db-postgres
    databaseName: imc_db
    user: imc_user
    plan: free
